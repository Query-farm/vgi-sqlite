#
# Builds the loadable extension (vgi.{so,dylib}) for every supported
# (OS, architecture) pair and publishes them to a GitHub Release.
#
# Windows is NOT in this matrix: the launcher/subprocess transport
# (src/rpc/launcher.{h,cpp}) is POSIX-only by design (fork/exec, flock,
# AF_UNIX) - see CLAUDE.md. A Windows build needs real portability work
# first, not just another matrix row.
#
# Every dependency vcpkg builds (Arrow, OpenSSL, etc.) is statically linked
# by vcpkg's own default triplet on Linux/macOS (x64-linux/arm64-linux/
# x64-osx/arm64-osx are all VCPKG_LIBRARY_LINKAGE=static) - this is what
# makes a single .so/.dylib actually redistributable: a dynamically-linked
# Arrow/OpenSSL would require the loading machine to already have
# compatible shared libraries installed at the right versions, which
# defeats the point of shipping a binary at all. See the "ABI contract"
# note in CLAUDE.md for the full reasoning, including the real, accepted
# limits this doesn't solve (a glibc version floor from the build
# environment's own libc; no musl/Alpine build).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # manual trigger, for testing the matrix before tagging

env:
  VCPKG_COMMIT: 05442024c3fda64320bd25d2251cc9807b84fb6f

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out vgi-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-cpp
          path: vgi-cpp

      - name: Check out vgi-rpc-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-cpp
          path: vgi-rpc-c++

      # See ci.yml's matching step for the full reasoning - gcc-12 does NOT
      # fix this (tried and confirmed still broken); GCC's own suggested
      # -flax-vector-conversions workaround does.
      - name: Work around libsodium/GCC ARM-NEON strictness (linux-arm64 only)
        if: matrix.platform == 'linux-arm64'
        run: |
          echo "CFLAGS=-flax-vector-conversions" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-flax-vector-conversions" >> "$GITHUB_ENV"

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> "$GITHUB_ENV"

      # See ci.yml's matching step for the full reasoning - same shared
      # Haybarn cache, same graceful read-only fallback if
      # QUERY_FARM_VCPKG_TOKEN isn't set.
      - name: Configure vcpkg binary cache
        env:
          QUERY_FARM_VCPKG_TOKEN: ${{ secrets.QUERY_FARM_VCPKG_TOKEN }}
        run: |
          if [ -n "$QUERY_FARM_VCPKG_TOKEN" ]; then
            REMOTE="http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer $QUERY_FARM_VCPKG_TOKEN"
          else
            REMOTE="http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,read"
          fi
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg-archives,readwrite;$REMOTE" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary archives (local)
        uses: actions/cache@v4
        with:
          path: vcpkg-archives
          key: vcpkg-release-${{ matrix.platform }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-release-${{ matrix.platform }}-${{ env.VCPKG_COMMIT }}-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autoconf-archive flex bison

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool autoconf-archive bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      # See ci.yml's matching step for the full reasoning (pinned rather
      # than apt/brew's whatever-is-current, for confirmed HTTP
      # remote-storage support).
      - name: Install ccache (pinned, for HTTP remote-storage support)
        run: |
          set -euo pipefail
          CCACHE_VERSION=4.14
          case "$RUNNER_OS" in
            Linux)
              case "$(uname -m)" in
                x86_64)  ASSET="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz" ;;
                aarch64) ASSET="ccache-${CCACHE_VERSION}-linux-aarch64-glibc.tar.xz" ;;
                *) echo "unsupported Linux arch: $(uname -m)" >&2; exit 1 ;;
              esac
              ;;
            macOS) ASSET="ccache-${CCACHE_VERSION}-darwin.tar.gz" ;;
            *) echo "unsupported RUNNER_OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${ASSET}" -o /tmp/ccache-archive
          mkdir -p /tmp/ccache-extract
          tar -xf /tmp/ccache-archive -C /tmp/ccache-extract
          BIN="$(find /tmp/ccache-extract -type f -name ccache)"
          sudo install -m 0755 "$BIN" /usr/local/bin/ccache
          ccache --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: release-${{ matrix.platform }}
          max-size: 500M
          install: 'no'

      - name: Configure ccache remote storage
        env:
          QUERY_FARM_VCPKG_TOKEN: ${{ secrets.QUERY_FARM_VCPKG_TOKEN }}
        run: |
          {
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=1"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
          if [ -n "$QUERY_FARM_VCPKG_TOKEN" ]; then
            echo "CCACHE_REMOTE_STORAGE=http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=$QUERY_FARM_VCPKG_TOKEN|connect-timeout=10000|operation-timeout=30000" >> "$GITHUB_ENV"
          fi

      - name: Fetch pinned SQLite
        run: scripts/fetch_sqlite.sh

      # -static-libgcc/-static-libstdc++ (Linux only) removes this build's
      # single biggest remaining portability risk: without it, the .so
      # dynamically requires whatever libstdc++.so.6 version this specific
      # build environment shipped, which can be newer than what an older-
      # but-still-common distro has installed ("version `GLIBCXX_3.4.32'
      # not found"). This does NOT remove the glibc floor itself (glibc is
      # never statically linkable in a way that's safe to redistribute) -
      # a binary built on ubuntu-24.04 still requires glibc >= what that
      # image ships (2.39) at minimum. Documented as a real, accepted v1
      # limitation rather than solved via an older build container - see
      # CLAUDE.md.
      # Split by OS rather than one conditional cmake invocation: the
      # static-link flags need to be one quoted argument
      # (CMAKE_MODULE_LINKER_FLAGS="-static-libgcc -static-libstdc++"), and
      # a GitHub Actions expression ternary embedded in a shell command line
      # doesn't preserve that quoting reliably.
      - name: Configure (Release, Linux)
        if: runner.os == 'Linux'
        run: >
          cmake --preset release
          -DVGI_CPP_SOURCE_DIR=${{ github.workspace }}/vgi-cpp
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_MODULE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      # 13.3, not a rounder-looking 12.0/13.0: vgi-cpp's arg_schema.cpp uses
      # std::to_chars's floating-point overload, which Apple's libc++ only
      # marks available from macOS 13.3 onward (an Apple-specific libc++
      # availability gate, not a real language/library-version requirement)
      # - a real build failure this same job's first attempt hit at 12.0,
      # not a guess. This is exactly the macOS deployment-target floor this
      # dependency actually needs, not an arbitrarily safe-sounding round
      # number.
      - name: Configure (Release, macOS)
        if: runner.os == 'macOS'
        run: >
          cmake --preset release
          -DVGI_CPP_SOURCE_DIR=${{ github.workspace }}/vgi-cpp
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3

      - name: Build
        run: cmake --build build-release --parallel

      # Prints exactly what the shipped binary dynamically depends on -
      # every run's log is a real record that nothing beyond expected
      # system libraries snuck in as a dynamic dependency (vcpkg's static
      # triplet is the mechanism; this is the verification that it
      # actually held for this specific build).
      - name: Verify dynamic dependencies
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L build-release/vgi.dylib || otool -L build-release/vgi.so
          else
            ldd build-release/vgi.so
          fi

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="vgi-sqlite-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGE"
          # CMake's MODULE library type on macOS actually produces .so by
          # default (see test/integration/conftest.py's own comment on
          # this same quirk) - ship whichever extension file exists.
          cp build-release/vgi.so "$STAGE/" 2>/dev/null || cp build-release/vgi.dylib "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: vgi-sqlite-${{ matrix.platform }}
          path: |
            vgi-sqlite-*.tar.gz
            vgi-sqlite-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    # Only on an actual tag push - workflow_dispatch is for validating the
    # build matrix itself without cutting a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
