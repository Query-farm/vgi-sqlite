name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the same commit vgi-c++'s own CI pins, for a consistent port
  # set across the org's sibling repos - vcpkg.json has no builtin-baseline
  # of its own (a known, separate gap - see CLAUDE.md), so without this the
  # exact ports resolved would otherwise drift between runs and between repos.
  VCPKG_COMMIT: 05442024c3fda64320bd25d2251cc9807b84fb6f

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # vgi-cpp (public) and, transitively through it, vgi-rpc-cpp (public) -
      # sibling-checkout build, same pattern vgi-c++'s own CI uses for
      # vgi-rpc-cpp. No credential needed: both are public repos.
      - name: Check out vgi-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-cpp
          path: vgi-cpp

      - name: Check out vgi-rpc-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-cpp
          path: vgi-rpc-c++

      # vgi-python (public) - source of the fixture worker test/integration
      # drives via `launch:` locations (see conftest.py).
      - name: Check out vgi-python
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-python
          path: vgi-python

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # libsodium 1.0.21's ARM-NEON crypto acceleration
      # (crypto_ipcrypt/ipcrypt_armcrypto.c) fails to compile on
      # ubuntu-24.04-arm's default GCC (13.3.0): "incompatible type for
      # argument 1 of 'vreinterpretq_u64_u8'" - the port's `BlockVec`
      # aliasing (uint64x2_t/uint8x16_t) is stricter than modern GCC's
      # NEON-intrinsic type checking allows. Trying gcc-12 instead of 13
      # does NOT fix it (confirmed - same error, gcc-12.4.0 is just as
      # strict here); the actual fix is GCC's own suggested workaround,
      # right there in its error output: "-flax-vector-conversions".
      # Applied globally for this job (CFLAGS/CXXFLAGS, not scoped to one
      # vcpkg port) since it's a narrow, semantically-harmless compat flag
      # this repo's own code doesn't use NEON intrinsics to care about
      # either way.
      - name: Work around libsodium/GCC ARM-NEON strictness (linux-arm64 only)
        if: matrix.platform == 'linux-arm64'
        run: |
          echo "CFLAGS=-flax-vector-conversions" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-flax-vector-conversions" >> "$GITHUB_ENV"

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)/vcpkg" >> "$GITHUB_ENV"

      # The shared Haybarn vcpkg binary cache (Cloudflare Worker in front of
      # R2 - see ~/Development/haybarn/haybarn-extension-ci-tools's
      # _extension_distribution.yml, the org's DuckDB-extension CI template).
      # It's already warm from every other Query-Farm/Haybarn C++ build
      # resolving overlapping ports (Arrow, OpenSSL, etc.) through the same
      # pinned vcpkg commit, which is most of this repo's own vcpkg install
      # time. Reads are anonymous; writes (populating whatever this repo
      # needs that ISN'T already warm upstream) need a bearer token - the
      # Worker (~/Development/haybarn/haybarn-vcpkg-worker) accepts any of
      # several independently-rotatable tokens, one per registered caller;
      # QUERY_FARM_VCPKG_TOKEN (this repo's own secret, not Haybarn's) is
      # ours. Built into VCPKG_BINARY_SOURCES in a run step, not a static
      # top-level env value, so the secret is never written as a literal
      # into the workflow file and so a missing secret degrades to
      # read-only instead of sending a broken empty "Authorization: Bearer "
      # header. Combined with a same-run/same-PR local `files` cache
      # (actions/cache below) so a genuinely cold port still only builds
      # from source once per (platform, vcpkg.json) key, not on every
      # single run.
      - name: Configure vcpkg binary cache
        env:
          QUERY_FARM_VCPKG_TOKEN: ${{ secrets.QUERY_FARM_VCPKG_TOKEN }}
        run: |
          if [ -n "$QUERY_FARM_VCPKG_TOKEN" ]; then
            REMOTE="http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer $QUERY_FARM_VCPKG_TOKEN"
          else
            REMOTE="http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,read"
          fi
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg-archives,readwrite;$REMOTE" >> "$GITHUB_ENV"

      # Local half of VCPKG_BINARY_SOURCES's `files,` source above - a
      # same-key restore lands here before any port needs building, and a
      # cold miss (not on the shared Haybarn cache either) still gets
      # written back for the NEXT run of this exact (platform, vcpkg.json)
      # combination, same as the old direct-archive-dir approach, just
      # composed with the shared read source instead of standing alone.
      - name: Cache vcpkg binary archives (local)
        uses: actions/cache@v4
        with:
          path: vcpkg-archives
          key: vcpkg-${{ matrix.platform }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-${{ env.VCPKG_COMMIT }}-

      # vcpkg builds libsodium through its autotools script and thrift
      # through flex/bison - both fail partway through configure without
      # these (a known, previously-hit-more-than-once gotcha - see
      # CLAUDE.md's "Things worth knowing" section).
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autoconf-archive flex bison

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool autoconf-archive bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      # Pinned rather than whatever apt/brew currently ship: HTTP
      # remote-storage support needs a genuinely recent ccache (a
      # chocolatey-packaged 4.9.1 is known to silently fail bearer-token
      # PUTs against this exact Worker on Windows - see
      # haybarn-extension-ci-tools's own upgrade step; not proven broken on
      # Linux/macOS package managers too, but pinning removes the question
      # entirely rather than trusting it). Official prebuilt binaries from
      # the ccache project, not a package manager.
      - name: Install ccache (pinned, for HTTP remote-storage support)
        run: |
          set -euo pipefail
          CCACHE_VERSION=4.14
          case "$RUNNER_OS" in
            Linux)
              case "$(uname -m)" in
                x86_64)  ASSET="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz" ;;
                aarch64) ASSET="ccache-${CCACHE_VERSION}-linux-aarch64-glibc.tar.xz" ;;
                *) echo "unsupported Linux arch: $(uname -m)" >&2; exit 1 ;;
              esac
              ;;
            macOS) ASSET="ccache-${CCACHE_VERSION}-darwin.tar.gz" ;;
            *) echo "unsupported RUNNER_OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${ASSET}" -o /tmp/ccache-archive
          mkdir -p /tmp/ccache-extract
          tar -xf /tmp/ccache-archive -C /tmp/ccache-extract
          BIN="$(find /tmp/ccache-extract -type f -name ccache)"
          sudo install -m 0755 "$BIN" /usr/local/bin/ccache
          ccache --version

      # hendrikmuhs/ccache-action still handles CCACHE_DIR + a local
      # GH-cache-backed L1 (install: 'no' - skip its own package-manager
      # install, the pinned binary above is already on PATH).
      - name: ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ matrix.platform }}
          max-size: 500M
          install: 'no'

      # L2: the same shared Haybarn Cloudflare-Worker-fronted R2 bucket
      # vcpkg's cache uses, under the `ccache/` key prefix - survives across
      # runs/branches/repos, unlike GH's own per-repo cache scope. Same
      # graceful degrade as vcpkg's cache: no token, no remote storage, just
      # the local L1 ccache-action already set up.
      - name: Configure ccache remote storage
        env:
          QUERY_FARM_VCPKG_TOKEN: ${{ secrets.QUERY_FARM_VCPKG_TOKEN }}
        run: |
          {
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=1"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
          if [ -n "$QUERY_FARM_VCPKG_TOKEN" ]; then
            echo "CCACHE_REMOTE_STORAGE=http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=$QUERY_FARM_VCPKG_TOKEN|connect-timeout=10000|operation-timeout=30000" >> "$GITHUB_ENV"
          fi

      - name: Fetch pinned SQLite
        run: scripts/fetch_sqlite.sh

      - name: Configure
        run: >
          cmake --preset default
          -DVGI_CPP_SOURCE_DIR=${{ github.workspace }}/vgi-cpp
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # No explicit -j needed: --parallel resolves the core count itself,
      # regardless of which generator the preset picked (CMakePresets.json
      # sets none, so this defaults to Unix Makefiles - which otherwise
      # builds serially with no -j at all, a real, previously-hit-more-
      # than-once mistake - see CLAUDE.md's EC2-build-box notes).
      - name: Build
        run: cmake --build build --parallel

      # test/integration/ is the test source of record (see CLAUDE.md's
      # "Definition of done") - drives the built extension via Python's
      # stdlib sqlite3 module against a real vgi-fixture-worker, not mocks.
      - name: Run integration tests
        working-directory: test/integration
        env:
          VGI_PYTHON: ${{ github.workspace }}/vgi-python
        run: |
          uv sync
          uv run pytest -v

  # A separate job, not a 4th matrix entry above: Windows needs PowerShell
  # syntax throughout (a mixed bash/pwsh matrix job would need per-step
  # if:/shell: branching on nearly every step, less readable than one job
  # that's Windows-flavored end to end) and a genuinely different toolchain
  # (cl.exe/lib.exe via vswhere, no autotools - vcpkg's libsodium/thrift
  # ports build via MSBuild on Windows, confirmed no autoconf/automake/
  # libtool/flex/bison needed there, unlike Linux/macOS).
  #
  # Verified real, not just "should work": both transports this driver
  # supports were checked end-to-end on a real Windows 11/MSVC box before
  # this job was written - plain subprocess spawn (the full existing
  # pytest suite, 52 passed/7 skipped, 0 failed) and `launch:`/AF_UNIX
  # (vgi_attach() over launch: against a real worker, real catalog
  # discovery, real data) - see CLAUDE.md's Windows entries for the full
  # history, including the vgi-rpc-c++ fix (Windows AF_UNIX client
  # transport, previously a stub) `launch:` needed.
  build-and-test-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Check out vgi-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-cpp
          path: vgi-cpp

      - name: Check out vgi-rpc-cpp
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-cpp
          path: vgi-rpc-c++

      - name: Check out vgi-python
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-python
          path: vgi-python

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout $env:VCPKG_COMMIT
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=$(Resolve-Path vcpkg)" >> $env:GITHUB_ENV

      # See the Linux/macOS job's matching step for the full reasoning -
      # same shared Haybarn cache, same graceful read-only fallback.
      - name: Configure vcpkg binary cache
        env:
          QUERY_FARM_VCPKG_TOKEN: ${{ secrets.QUERY_FARM_VCPKG_TOKEN }}
        run: |
          if ($env:QUERY_FARM_VCPKG_TOKEN) {
            $remote = "http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer $env:QUERY_FARM_VCPKG_TOKEN"
          } else {
            $remote = "http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,read"
          }
          $archives = Join-Path $env:GITHUB_WORKSPACE "vcpkg-archives"
          echo "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite;$remote" >> $env:GITHUB_ENV

      - name: Cache vcpkg binary archives (local)
        uses: actions/cache@v4
        with:
          path: vcpkg-archives
          key: vcpkg-windows-x86_64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x86_64-${{ env.VCPKG_COMMIT }}-

      # See the Linux/macOS job's matching step - pinned rather than
      # whatever chocolatey/winget currently ship, for confirmed HTTP
      # remote-storage support (a chocolatey-packaged 4.9.1 is known to
      # silently fail bearer-token PUTs against this exact Worker on
      # Windows - haybarn-extension-ci-tools's own upgrade-to-4.13.6 step,
      # the actual finding this pin is based on, not a guess for this
      # platform).
      - name: Install ccache (pinned, for HTTP remote-storage support)
        run: |
          $CCACHE_VERSION = "4.14"
          $asset = "ccache-$CCACHE_VERSION-windows-x86_64.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/$asset" -OutFile ccache.zip
          Expand-Archive -Path ccache.zip -DestinationPath ccache-extract -Force
          $dir = (Get-ChildItem -Recurse -Path ccache-extract -Filter ccache.exe | Select-Object -First 1).DirectoryName
          echo $dir >> $env:GITHUB_PATH
          & "$dir\ccache.exe" --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: windows-x86_64
          max-size: 500M
          install: 'no'

      - name: Configure ccache remote storage
        env:
          QUERY_FARM_VCPKG_TOKEN: ${{ secrets.QUERY_FARM_VCPKG_TOKEN }}
        run: |
          @(
            "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE"
            "CCACHE_NOHASHDIR=1"
            "CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines"
            "CCACHE_COMPILERCHECK=content"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:QUERY_FARM_VCPKG_TOKEN) {
            "CCACHE_REMOTE_STORAGE=http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=$env:QUERY_FARM_VCPKG_TOKEN|connect-timeout=10000|operation-timeout=30000" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Fetch pinned SQLite
        run: .\scripts\fetch_sqlite.ps1

      # No -G: letting CMake auto-detect the installed Visual Studio
      # generator (rather than hardcoding one, e.g. "Visual Studio 17
      # 2022") is what keeps this from silently breaking whenever GitHub
      # updates the windows-2022 image's bundled VS version. -A x64 is
      # still explicit - the VS generator's own default architecture
      # isn't guaranteed to be x64 without it.
      - name: Configure
        run: >
          cmake --preset default -A x64
          -DVGI_CPP_SOURCE_DIR="$env:GITHUB_WORKSPACE\vgi-cpp"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Debug --parallel

      # A `launch:` worker's own `uv run --project vgi-python ...` does its
      # OWN implicit dependency install/sync on its first-ever invocation,
      # same as any uv project - fine on Linux/macOS (fast enough there
      # not to matter), but on a cold Windows runner pyarrow/numpy's first
      # install can run long enough to blow LaunchConfig's 60s
      # worker_startup_timeout, so the VERY FIRST test in the whole run
      # would see "worker did not emit UNIX:<path> within startup
      # timeout" - not a launcher bug, a slow first uv run racing a tight
      # timeout. Confirmed as the actual cause: every worker location
      # (vgi-fixture-worker, vgi-fixture-simple-writable-worker, the
      # row_transform fixture) failed this exact way, together, on this
      # job's first real GitHub-hosted run - a systemic first-run cost,
      # not anything specific to one fixture. Pre-syncing here, before any
      # launch: call happens, removes that race entirely.
      - name: Pre-sync vgi-python dependencies
        run: uv sync --project "${{ github.workspace }}\vgi-python"

      - name: Run integration tests
        working-directory: test/integration
        env:
          VGI_PYTHON: ${{ github.workspace }}\vgi-python
        run: |
          uv sync
          uv run pytest -v
